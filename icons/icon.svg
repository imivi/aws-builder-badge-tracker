<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="awsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb74d"/>
      <stop offset="50%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Shield / Hexagon -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" filter="url(#shadow)"/>

  <!-- Subtle glow ring -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="#ff9900" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Star / Badge Shape -->
  <path d="M64 22 L76 46 L102 50 L83 69 L88 95 L64 82 L40 95 L45 69 L26 50 L52 46 Z" 
        fill="url(#awsGrad)" 
        stroke="#ffffff" 
        stroke-width="2" 
        stroke-linejoin="round"
        filter="url(#shadow)"/>

  <!-- Inner Center Star / Flame Spark -->
  <polygon points="64,36 71,51 87,54 75,66 78,82 64,74 50,82 53,66 41,54 57,51" fill="#ffffff" opacity="0.35"/>

  <!-- Checkmark at bottom right badge -->
  <circle cx="94" cy="94" r="18" fill="#10b981" stroke="#0f172a" stroke-width="3"/>
  <path d="M88 94 L93 99 L101 89" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

